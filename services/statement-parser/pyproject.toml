[project]
name = "statement-parser"
version = "0.1.0"
description = "Stateless parser for CAMS consolidated account statement (CAS) PDFs"
readme = "README.md"
authors = [
    { name = "Nakul Bhuwalka", email = "nakulbhuwalka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
